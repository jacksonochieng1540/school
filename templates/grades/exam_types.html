{% extends "base.html" %}
{% block title %}Exam Types{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>Exam Types</h2>
  <a href="{% url 'grades:add_exam_type' %}" class="btn btn-success mb-3">+ Add Exam Type</a>

  <ul class="list-group">
    {% for exam_type in exam_types %}
    <li class="list-group-item">{{ exam_type.name }}</li>
    {% empty %}
    <li class="list-group-item text-muted">No exam types found.</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
