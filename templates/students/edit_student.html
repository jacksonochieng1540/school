{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Student: {{ student.user.first_name }} {{ student.user.last_name }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary">Update</button>
        <a href="{% url 'students:detail' student.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
