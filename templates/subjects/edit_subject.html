{% extends "base.html" %}
{% block title %}Edit Subject{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Subject: {{ subject.name }}</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'subjects:detail' subject.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
