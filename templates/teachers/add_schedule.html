{% extends "base.html" %}
{% block title %}Add Schedule{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Add Schedule for {{ teacher.full_name }}</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'teachers:schedule' teacher.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
