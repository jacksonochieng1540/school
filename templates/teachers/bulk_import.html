{% extends "base.html" %}
{% block title %}Bulk Import Teachers{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Bulk Import Teachers</h2>
    <p class="text-muted">Upload a CSV file to import teachers (feature coming soon).</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="csv_file" class="form-control mb-3" accept=".csv">
        <button type="submit" class="btn btn-primary">Upload</button>
        <a href="{% url 'teachers:list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
