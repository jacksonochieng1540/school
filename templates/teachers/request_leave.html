{% extends "base.html" %}
{% block title %}Request Leave{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Leave Request for {{ teacher.full_name }}</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Submit</button>
        <a href="{% url 'teachers:detail' teacher.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
